name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Type-check and build all workspaces
  # Catches TypeScript errors and broken imports before they hit production.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages (contracts, logger, metrics)
        run: npm run build:shared

      - name: Build all microservices
        run: npm run build

      - name: Type-check root workspace
        run: |
          # Verify no TypeScript errors across the repo
          npx tsc --noEmit --project services/api-gateway/tsconfig.json
          npx tsc --noEmit --project services/execution-worker/tsconfig.json
          npx tsc --noEmit --project services/system-monitor/tsconfig.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            shared/contracts/dist
            shared/logger/dist
            shared/metrics/dist
            services/api-gateway/dist
            services/execution-worker/dist
            services/system-monitor/dist
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Sandbox security & failure tests
  # Runs against the same Docker Compose stack used locally.
  # Tests adversarial scenarios: infinite loop, fork bomb, OOM,
  # infinite output, worker crash recovery, and API/WebSocket regressions.
  # ──────────────────────────────────────────────────────────────────────────
  failure-tests:
    name: Failure & Security Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript packages
        run: npm run build

      - name: Build sandbox runner images
        run: npm run docker:build:runners

      - name: Build Compose service images
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml build

      - name: Start Compose stack
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml up -d --scale execution-worker=3

      - name: Wait for API Gateway
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API Gateway healthy"
              exit 0
            fi
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml ps
            sleep 2
          done
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml logs --tail=200
          exit 1

      - name: Run end-to-end WebSocket stream test
        env:
          API_KEY: test-api-key
        run: node test-ws.js

      - name: Run failure test suite
        env:
          API_KEY: test-api-key
        run: bash tests/failure/run-failure-tests.sh

      - name: Verify Prometheus metrics endpoints are alive
        run: |
          curl -sf http://localhost:9100/metrics | grep -q 'code_execution_queue_depth'
          curl -sf http://localhost:9102/metrics | grep -q 'code_execution_dead_worker_recoveries'
          worker_container="$(docker ps --filter 'name=infra-execution-worker' --format '{{.Names}}' | head -n 1)"
          test -n "$worker_container"
          docker exec "$worker_container" wget -qO- http://localhost:9101/metrics | grep -q 'code_execution_worker_jobs_total'
          echo "All metrics endpoints healthy"

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml logs --tail=300

      - name: Stop Compose stack
        if: always()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.services.yml down -v
