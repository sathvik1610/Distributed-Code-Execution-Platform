global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:9100']

  - job_name: 'execution-worker'
    static_configs:
      - targets: ['execution-worker:9101']

  - job_name: 'system-monitor'
    static_configs:
      - targets: ['system-monitor:9102']
