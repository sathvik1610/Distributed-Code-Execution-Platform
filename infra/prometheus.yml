global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'execution-worker'
    static_configs:
      - targets: ['host.docker.internal:9101']

  - job_name: 'system-monitor'
    static_configs:
      - targets: ['host.docker.internal:9102']
